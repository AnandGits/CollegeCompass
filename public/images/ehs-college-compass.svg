<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">College Compass mark</title>
  <desc id="desc">A compass with a marigold needle pointing toward a graduation cap, connected by a dashed route from a starting point — representing the journey to college.</desc>

  <g fill="none" stroke="#E7E2D8" stroke-width="1">
    <circle cx="320" cy="320" r="230" opacity="0.6" />
    <circle cx="320" cy="320" r="270" opacity="0.4" />
    <circle cx="320" cy="320" r="305" opacity="0.25" />
  </g>

  <path d="M 118 468
           C 165 430, 150 340, 205 300
           C 275 250, 330 205, 385 175
           C 415 158, 445 150, 468 150"
        fill="none"
        stroke="#E8863C"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-dasharray="2 14" />

  <g transform="translate(118 468)">
    <circle r="7" fill="none" stroke="#E8863C" stroke-width="3" />
  </g>
  <text x="118" y="500" text-anchor="middle"
        font-family="Consolas, ui-monospace, monospace"
        font-size="12" letter-spacing="2" fill="#4B5773">YOU ARE HERE</text>

  <g transform="translate(468 150)">
    <polygon points="0,-34 46,-14 0,6 -46,-14" fill="#2B4C8C" />
    <rect x="-15" y="-14" width="30" height="20" rx="2" fill="#2B4C8C" />
    <line x1="30" y1="-16" x2="30" y2="10" stroke="#2B4C8C" stroke-width="3" />
    <circle cx="30" cy="14" r="4.5" fill="#E8863C" />
  </g>

  <circle cx="320" cy="320" r="150" fill="none" stroke="#16213E" stroke-width="3" />
  <circle cx="320" cy="320" r="132" fill="none" stroke="#E7E2D8" stroke-width="1.5" />

  <g stroke="#16213E" stroke-width="2.5" stroke-linecap="round">
    <line x1="320" y1="176" x2="320" y2="196" />
    <line x1="320" y1="444" x2="320" y2="464" />
    <line x1="176" y1="320" x2="196" y2="320" />
    <line x1="444" y1="320" x2="464" y2="320" />
  </g>
  <g stroke="#4B5773" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <line x1="223.8" y1="223.8" x2="238.1" y2="238.1" />
    <line x1="416.2" y1="223.8" x2="401.9" y2="238.1" />
    <line x1="223.8" y1="416.2" x2="238.1" y2="401.9" />
    <line x1="416.2" y1="416.2" x2="401.9" y2="401.9" />
  </g>

  <text x="320" y="168" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="15" font-weight="600" fill="#16213E">N</text>
  <text x="320" y="482" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="15" fill="#4B5773">S</text>
  <text x="163" y="326" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="15" fill="#4B5773">W</text>
  <text x="477" y="326" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="15" fill="#4B5773">E</text>

  <g transform="translate(320 320) rotate(-38)">
    <polygon points="0,-108 16,0 0,14 -16,0" fill="#E8863C" />
    <polygon points="0,108 16,0 0,-14 -16,0" fill="#2B4C8C" />
    <circle r="11" fill="none" stroke="#16213E" stroke-width="2.5" />
  </g>
</svg>
